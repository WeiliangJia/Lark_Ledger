[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "lark-test-ledger"
version = "0.3.0"
description = "Reusable Codex test-case workflow backed by a Lark Base ledger"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dms-test-ledger = "dms_test_ledger.cli:main"
lark-test-ledger = "dms_test_ledger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
