name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build bundled Skill runtime
        shell: pwsh
        run: ./Build-SkillRuntime.ps1
      - name: Check installer and initialization
        shell: pwsh
        run: ./tests/test_setup.ps1
